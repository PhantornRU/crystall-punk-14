
# ============================
# Loot Stages (Fur / Wool)
# ============================

# Parent stage for all loot/fur items
- type: CP14ButcherStage
  id: ParentStage_Loot
  tool: Knife
  delay: 2
  requireDead: true

- type: CP14ButcherStage
  parent: ParentStage_Loot
  id: CP14Stage_Loot_Fur_Cheap
  spawned:
    - id: CP14CheapFur
      amount: 1

# Small fur (e.g., rabbit)
- type: CP14ButcherStage
  parent: ParentStage_Loot
  id: CP14Stage_Loot_Fur
  spawned:
    - id: CP14Fur
      amount: 1

# Medium fur (e.g., pig)
- type: CP14ButcherStage
  parent: ParentStage_Loot
  id: CP14Stage_Loot_Fur_Medium
  spawned:
    - id: CP14CheapFur
      amount: 1
    - id: CP14Fur
      amount: 1
      prob: 0.5

# Good fur (e.g., bear)
- type: CP14ButcherStage
  parent: ParentStage_Loot
  id: CP14Stage_Loot_Fur_Good
  spawned:
    - id: CP14GoodFur
      amount: 1

# Wool / string (sheep)
- type: CP14ButcherStage
  parent: ParentStage_Loot
  id: CP14Stage_Loot_Wool
  spawned:
    - id: CP14CheapFur
      amount: 1
    - id: CP14String
      amount: 4
      maxAmount: 16